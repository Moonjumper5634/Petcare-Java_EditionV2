spring.application.name=petcare
server.port=${PORT:8081}

# ---- MySQL --------------------------------------------------------------------------------
# Create nothing by hand: the petcare database is created on first start and Flyway builds the tables.
# Credentials come from environment variables so they never end up in Git:
#   PowerShell:  $env:PETCARE_DB_USER="root"; $env:PETCARE_DB_PASSWORD="your-password"
spring.datasource.url=${PETCARE_DB_URL:jdbc:mysql://localhost:3307/petcare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
spring.datasource.username=${PETCARE_DB_USER:root}
spring.datasource.password=${PETCARE_DB_PASSWORD:}

# ---- Flyway owns the schema; Hibernate only checks that the entities match it ------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Manila

# "dev" is the default profile (demo data + dev endpoints). Production: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Empty = real date. dev pins it so the seeded pets keep their expected eligibility results.
petcare.reference-date=

spring.web.resources.cache.cachecontrol.max-age=0
